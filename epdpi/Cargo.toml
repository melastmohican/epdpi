[package]
name = "epdpi"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "no_std embedded-hal 1.0 compatible Rust driver framework, blocking or async, for raw-parallel Electronic Paper Displays (EPD): ED047TC1 on M5Stack PaperDIY"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/epdpi"
readme = "README.md"
homepage.workspace = true
keywords = ["epd", "epaper", "async", "embedded-hal", "embedded-graphics"]
categories = ["embedded", "no-std", "hardware-support", "asynchronous"]
rust-version = "1.85"
exclude = [
    "CLAUDE.md",
    "**/.DS_Store",
]

[dependencies]
embedded-hal = "1.0.0"
embedded-graphics-core = { version = "0.4.0", optional = true }
embedded-hal-async = "1.0.0"
maybe-async-cfg = "0.2"

[dependencies.defmt]
version = "1.0"
optional = true

[dev-dependencies]
embedded-graphics = "0.8.1"
pollster = "1"

[features]
default = ["blocking", "graphics"]
# Blocking `embedded-hal` 1.0 API (the default). Disabling this (via `default-features = false`)
# switches every bus and driver method to its `embedded-hal-async` counterpart instead. The two
# APIs are mutually exclusive, not additive, so re-add `graphics` explicitly if wanted:
# `epdpi = { version = "0.1", default-features = false, features = ["graphics"] }`.
blocking = []
graphics = ["dep:embedded-graphics-core"]
defmt = ["dep:defmt"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
