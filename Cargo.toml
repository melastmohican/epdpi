[workspace]
resolver = "3"
members = ["epdpi", "epdpi-esp"]
# Host commands (`cargo test`, `cargo clippy`) cover the core only. `epdpi-esp` needs the
# `esp` toolchain once its chip feature is on, so it is checked with `-p epdpi-esp`.
default-members = ["epdpi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mariusz Jurgielewicz <mordor@mail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/melastmohican/epdpi"
homepage = "https://github.com/melastmohican/epdpi"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
