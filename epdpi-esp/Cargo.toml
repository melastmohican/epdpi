[package]
name = "epdpi-esp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "ESP32 parallel buses for the epdpi e-paper driver: LCD_CAM with DMA and register-level GPIO (ESP32-S3 tested)"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/epdpi-esp"
readme = "README.md"
homepage.workspace = true
keywords = ["epd", "epaper", "esp32s3", "esp-hal", "embedded-hal"]
categories = ["embedded", "no-std", "hardware-support"]
# esp-hal 1.1 needs Rust 1.88.
rust-version = "1.88"
exclude = ["**/.DS_Store"]

[dependencies]
# Default features off, so this crate never switches the core to blocking by itself. The
# `blocking` feature below forwards the choice.
epdpi = { version = "0.1.0", path = "../epdpi", default-features = false }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
maybe-async-cfg = "0.2"
esp-hal = { version = "~1.1.0", optional = true, features = ["unstable"] }
defmt = { version = "1.0", optional = true }

[dev-dependencies]
pollster = "1"

[features]
default = ["blocking"]
# Blocking `embedded-hal` API, forwarded to `epdpi`. Turn off with `default-features = false`
# for the async API. `LcdBus` is blocking only for now.
blocking = ["epdpi/blocking"]
defmt = ["dep:defmt", "epdpi/defmt"]
# The ESP32-S3, the only chip so far. Pulls in `esp-hal` and enables `lcd_bus`.
esp32s3 = ["dep:esp-hal", "esp-hal/esp32s3"]

[lints]
workspace = true
