name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:
  # Lets release.yml run this exact matrix against the tagged commit and gate
  # publishing on it passing, instead of relying on a separately-triggered,
  # separately-timed CI run on the branch push that happened to land the tag.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: check
            args: --all-targets
          - command: check
            args: --no-default-features
          - command: check
            args: --features defmt
          - command: test
            args: --workspace
          - command: clippy
            args: -p epdpi --all-features -- -D warnings
          # `epdpi-esp` without a chip feature, so it builds on the host. The chip feature is
          # checked in the ESP32-S3 job.
          - command: clippy
            args: -p epdpi-esp --all-targets -- -D warnings
          - command: doc
            args: --no-deps --all-features
            # Broken intra-doc links are warnings by default, so the doc job
            # would pass while shipping dead links to docs.rs.
            rustdocflags: "-D warnings"
          - command: doc
            args: --no-deps -p epdpi-esp
            rustdocflags: "-D warnings"
          # Async API (`blocking` off). `--no-default-features` above already covers
          # async-without-graphics; these three cover the realistic async consumer shape.
          - command: check
            args: --no-default-features --features graphics --all-targets
          - command: test
            args: --no-default-features --features graphics --workspace
          - command: clippy
            args: --no-default-features --features graphics -p epdpi -- -D warnings
          - command: clippy
            args: -p epdpi-esp --all-targets --no-default-features -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
        env:
          RUSTDOCFLAGS: ${{ matrix.action.rustdocflags }}

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          # Must match `rust-version` in Cargo.toml.
          toolchain: "1.85"
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Drop lockfile
        # Resolving fresh mirrors what a consumer on the MSRV would get, instead of the
        # versions pinned by the committed Cargo.lock.
        run: rm -f Cargo.lock
      - name: Check library (blocking)
        run: cargo check --all-features
      - name: Check library (async)
        # `--all-features` above enables `blocking`, which wins over the async `cfg` branches,
        # so native async fn in traits is only exercised with `blocking` off.
        run: cargo check --no-default-features --features graphics --all-targets

  build-targets:
    name: Build for RP2040
    # Cortex-M0+ has no atomics and a 32-bit usize, so it is the strictest no_std canary.
    # Other bare-metal targets are added when we own hardware for them.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - ""                                            # blocking (default)
          - "--no-default-features --features graphics"   # async
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: thumbv6m-none-eabi
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Build library
        run: cargo check --target thumbv6m-none-eabi ${{ matrix.args }}

  build-esp32s3:
    name: Build for ESP32-S3
    # The board this crate runs on. Xtensa needs the esp toolchain and a core built from source.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - "-p epdpi"                                              # core, blocking
          - "-p epdpi --no-default-features --features graphics"    # core, async
          - "-p epdpi-esp --features esp32s3"                       # buses, blocking
          - "-p epdpi-esp --no-default-features --features esp32s3" # buses, async (fast_bus only)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo check --target xtensa-esp32s3-none-elf -Zbuild-std=core ${{ matrix.args }}
